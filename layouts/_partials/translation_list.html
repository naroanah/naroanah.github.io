{{- if .IsTranslated -}}
    <span class="meta-item">
        <span>{{- i18n "translations" | default "Translations" }}:</span>
        <ul class="i18n_list">
            {{- range .Translations }}
            <li>
                <a href="{{ .Permalink }}">
                    {{- if (and site.Params.displayFullLangName (.Language.Label)) }}
                    {{- .Language.Label | emojify -}}
                    {{- else }}
                    {{- .Lang | title -}}
                    {{- end -}}
                </a>
            </li>
            {{- end }}
        </ul>
    </span>
{{- end -}}
